services:
  nocodb:
    image: nocodb/nocodb:2026.07.0
    restart: unless-stopped
    labels:
      - autoheal=true
    environment:
      - NC_DB=pg://postgres:5432?u=${NC_DB_USER}&p=${NC_DB_PASSWORD}&d=${NC_DB}
      - NC_DISABLE_TELE=true
      - NC_ALLOW_LOCAL_EXTERNAL_DBS=${NC_ALLOW_LOCAL_EXTERNAL_DBS}
      - NC_ATTACHMENT_FIELD_SIZE=${NC_ATTACHMENT_FIELD_SIZE}
      - NC_S3_BUCKET_NAME=${MINIO_BUCKET_ATTACHMENTS}
      - NC_S3_REGION=us-east-1
      - NC_S3_ACCESS_KEY=${NOCODB_MINIO_ACCESS_KEY}
      - NC_S3_ACCESS_SECRET=${NOCODB_MINIO_SECRET_KEY}
      - NC_S3_ENDPOINT=${MINIO_ENDPOINT}
      - NC_S3_FORCE_PATH_STYLE=true
      # Links in reset-password / invite emails are built from this.
      - NC_PUBLIC_URL=https://${NC_HOST}
      # SMTP via Resend (password reset, invites). Resend's SMTP user is literally "resend",
      # the password is the API key.
      - NC_SMTP_FROM=${NC_SMTP_FROM}
      - NC_SMTP_HOST=smtp.resend.com
      - NC_SMTP_PORT=465
      - NC_SMTP_SECURE=true
      - NC_SMTP_USERNAME=resend
      - NC_SMTP_PASSWORD=${RESEND_API_KEY}
    ports:
      # Loopback-only (see fragments/postgres-compose.yml). Host port 8081 (not 8080)
      # to avoid clashing with other local services on 8080.
      - "127.0.0.1:8081:8080"
    volumes:
      - nocodb_storage:/usr/app/data
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8080/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
