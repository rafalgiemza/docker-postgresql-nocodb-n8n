services:
  minio:
    # Pinned, not `latest`: minio/minio was archived by MinIO Inc. in April
    # 2026 (community edition end-of-life, folded into paid AIStor) — this is
    # the final OSS build that will ever exist, so `latest` and this pin are
    # now permanently the same image. Pinning makes that explicit instead of
    # implicit. See post-mortem/mikrus/vps-migration-decision.md and
    # .ai/PRD.md §4 for the SeaweedFS detour and why it was reverted.
    image: quay.io/minio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    labels:
      - autoheal=true
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      # Loopback-only (see fragments/postgres-compose.yml): API + console.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_storage:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
