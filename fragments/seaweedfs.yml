services:
  seaweedfs:
    image: chrislusf/seaweedfs:${SEAWEEDFS_VERSION}
    restart: unless-stopped
    labels:
      - autoheal=true
    # Overrides the image's default ENTRYPOINT with a wrapper that renders
    # the S3 identity config (root + nocodb) from env, then chains into the
    # image's own /entrypoint.sh — preserves its /data chown-to-seaweed-user
    # + privilege-drop logic. See scripts/seaweedfs-entrypoint.sh and
    # .ai/migrate-from-minio-to-SeaweedFS.md.
    entrypoint: ['/bin/sh', '/seaweedfs-entrypoint.sh']
    environment:
      - SEAWEEDFS_ROOT_ACCESS_KEY=${SEAWEEDFS_ROOT_ACCESS_KEY}
      - SEAWEEDFS_ROOT_SECRET_KEY=${SEAWEEDFS_ROOT_SECRET_KEY}
      - NOCODB_SEAWEEDFS_ACCESS_KEY=${NOCODB_SEAWEEDFS_ACCESS_KEY}
      - NOCODB_SEAWEEDFS_SECRET_KEY=${NOCODB_SEAWEEDFS_SECRET_KEY}
      - SEAWEEDFS_BUCKET_ATTACHMENTS=${SEAWEEDFS_BUCKET_ATTACHMENTS}
    ports:
      # Loopback-only (see fragments/postgres.yml): S3 API + master status.
      # No console equivalent to MinIO's :9001 — see
      # .ai/migrate-from-minio-to-SeaweedFS.md §5.
      - "127.0.0.1:8333:8333"
      - "127.0.0.1:9333:9333"
    volumes:
      - seaweedfs_storage:/data
      - ../scripts/seaweedfs-entrypoint.sh:/seaweedfs-entrypoint.sh:ro
    healthcheck:
      # Master's cluster status endpoint — HTTP 200 with {"IsLeader":true,...}
      # once the single-node master is up. Verified locally against 4.41
      # (FAZA 0/2, .ai/migrate-from-minio-to-SeaweedFS.md) — SeaweedFS has no
      # `mc ready`-style healthcheck like MinIO. 127.0.0.1, not localhost:
      # this image resolves localhost to ::1 first and the master only binds
      # IPv4, so wget would hit nothing and report a false "unhealthy" (same
      # pitfall as caddy's/librechat's healthchecks, see docs/docker.md).
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9333/cluster/status | grep -q "\"IsLeader\":true" || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
