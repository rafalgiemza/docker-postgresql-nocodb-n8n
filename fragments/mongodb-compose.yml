# LibreChat — team AI chat (PRD §1.1). Own MongoDB, zero coupling to the
# CRM Postgres data. Deliberately minimal: no admin-panel/Meilisearch/
# RAG API/vectordb from upstream's full compose — none of those are in
# scope or budgeted for in the PRD RAM table.
#
# Ready-to-migrate (PRD §8.7): gated behind the "local-mongo" profile
# (toggled by COMPOSE_PROFILES in .env) so that switching MONGO_URI to an
# external/managed Mongo is a pure .env change — set COMPOSE_PROFILES= and
# MONGO_URI=<external uri>, then `make down && make up`. No compose edits.
services:
  mongodb:
    # Pinned to match upstream LibreChat's own tested docker-compose.yml
    # pairing (not `latest`/major-only): jumping straight to a newer Mongo
    # major can hit https://github.com/danny-avila/LibreChat/issues/10304
    # (server refuses to start unless featureCompatibilityVersion is migrated
    # first). Requires the VPS's virtual CPU to expose AVX (see post-mortem
    # docs — was blocked on the Sferahost VPS PRO box until they enabled CPU
    # host-passthrough). Don't blindly merge a Dependabot major bump here —
    # check LibreChat's compose pairing first.
    image: mongo:8.0.20
    restart: unless-stopped
    labels:
      - autoheal=true
    profiles: ['local-mongo']
    volumes:
      - mongo_storage:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
