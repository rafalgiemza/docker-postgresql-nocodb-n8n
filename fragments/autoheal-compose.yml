# Docker's own healthcheck only marks a container `unhealthy` — it never
# restarts it. autoheal watches the Docker socket and restarts any
# container labeled `autoheal=true` once it's been `unhealthy` for
# AUTOHEAL_INTERVAL seconds, closing that gap (post-mortem/tasks.md Task 3).
services:
  autoheal:
    # Upstream hasn't cut a versioned tag since 1.2.0 (2021) — only `latest`
    # is maintained, so there's no semver to pin to. Digest-pinned instead:
    # Dependabot still opens a PR whenever upstream rebuilds `latest`, just
    # keyed on digest rather than a version bump.
    image: willfarrell/autoheal:latest@sha256:54d39df356bdb907e095d2207ee23849d4eebd9be432dc3ec880caf76ed133f3
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
